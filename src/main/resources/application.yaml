spring:
  application:
    name: projectProgressManagement

  datasource:
    url: jdbc:mysql://localhost:3306/project_mgmt?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci&characterSetResults=UTF-8
    username: root
    password: Root@123456
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 18080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: project-mgmt-secret-key-2026-jwt-token-project-mgmt
  expiration: 86400000
